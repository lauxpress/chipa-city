<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chipa City — prueba de escenas 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #1a1420; color: #f4f0d8; font-family: 'Press Start 2P', monospace; padding: 24px; }
  h1 { font-size: 16px; color: #f0c030; }
  button { font: inherit; font-size: 11px; margin: 6px; padding: 10px 14px; background: #2a2230; color: #f4f0d8; border: 2px solid #f0c030; cursor: pointer; box-shadow: 4px 4px 0 #000; }
  label { font-size: 10px; margin-right: 16px; }
  input { font: inherit; font-size: 10px; width: 60px; }
  #log { margin-top: 20px; font-size: 10px; line-height: 2; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Escenas 3D — banco de pruebas</h1>
<div>
  <label>Dificultad <input id="dif" type="number" min="1" max="10" value="3"></label>
  <label>Semilla <input id="seed" type="text" value="corrientes"></label>
  <label><input id="fps" type="checkbox" checked> FPS</label>
</div>
<div id="btns"></div>
<h1 style="font-size:11px;margin-top:18px">Con los opts de las misiones</h1>
<div id="mbtns"></div>
<div id="log"></div>
<script src="vendor/three.min.js"></script>
<script>
  // stub mínimo de window.Chipa
  window.Chipa = { openModal(o) { console.log('openModal', o); }, closeModal() { console.log('closeModal'); } };
  window.__scenesCapture = true;
  window.__scenesShowFps = true;
</script>
<script src="scenes.js"></script>
<script src="missions_data.js"></script>
<script>
  const log = t => { document.getElementById('log').textContent = t + '\n' + document.getElementById('log').textContent; };
  for (const s of Chipa.scenes.list) {
    const b = document.createElement('button'); b.textContent = s.id; b.title = s.name;
    b.onclick = () => {
      window.__scenesShowFps = document.getElementById('fps').checked;
      const opts = { difficulty: +document.getElementById('dif').value, seed: document.getElementById('seed').value };
      Chipa.scenes.play(s.id, opts).then(r => log(s.id + ' → ' + JSON.stringify(r)));
    };
    document.getElementById('btns').appendChild(b);
  }
  // escenas tal como las llaman las misiones (opts del guion en missions_data.js)
  window.MISSION_SCENES = [];
  for (const m of (window.MISSIONS || [])) (m.steps || []).forEach((s, k) => {
    if (s.type !== 'scene') return;
    const name = m.id + '#' + k + ' ' + s.id + (s.opts && s.opts.pomberoAyuda !== undefined ? (s.opts.pomberoAyuda ? ' (con Pombero)' : ' (sin Pombero)') : '');
    MISSION_SCENES.push({ name, id: s.id, opts: s.opts || {} });
    const b = document.createElement('button'); b.textContent = name; b.style.fontSize = '9px';
    b.onclick = () => { window.__scenesShowFps = document.getElementById('fps').checked; Chipa.scenes.play(s.id, Object.assign({ mission: m.id, flags: {} }, s.opts)).then(r => log(name + ' → ' + JSON.stringify(r))); };
    document.getElementById('mbtns').appendChild(b);
  });
  // __goM('tunel', 0, 'captura') abre la n-ésima escena de misión con ese id
  window.__goM = (id, n = 0, name, steps = 90, extra = {}) => {
    const s = MISSION_SCENES.filter(x => x.id === id)[n]; if (!s) return 'no hay';
    return __go(id, Object.assign({}, s.opts, extra), name, steps);
  };
  // captura: renderiza y manda el PNG al servidor local de capturas
  window.__shot = async (name) => {
    const c = document.querySelector('.cs3d-gl'); if (!c) return 'sin escena';
    const url = c.toDataURL('image/png');
    // puerto del servidor de capturas: ?shot=8771 en la URL o window.__shotPort (def. 8767)
    const port = window.__shotPort || new URLSearchParams(location.search).get('shot') || 8767;
    const r = await fetch('http://127.0.0.1:' + port + '/' + (name || 'shot'), { method: 'POST', body: url });
    return await r.text();
  };
  // abre una escena, avanza n pasos y captura (funciona con la pestaña en segundo plano)
  window.__go = async (id, o, name, steps = 90) => {
    Chipa.scenes.play(id, o).then(r => { window.__res = r; log(id + ' → ' + JSON.stringify(r)); });
    await new Promise(r => setTimeout(r, 1200));
    __scenesCur.debugStep(steps); return name ? await __shot(name) : 'ok';
  };
  window.__key = (code, frames = 20, after = 25) => {
    const s = __scenesCur; window.dispatchEvent(new KeyboardEvent('keydown', { code }));
    s.debugStep(frames); window.dispatchEvent(new KeyboardEvent('keyup', { code })); s.debugStep(after);
  };
</script>
</body>
</html>
